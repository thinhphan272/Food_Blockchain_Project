version: '3.8'

# ==============================================================================
# PRODUCTION DOCKER COMPOSE - FULL STACK (6 DBs + BACKEND + FRONTEND NGINX)
# Chế độ đóng gói nghiệm thu toàn diện (Mục 3.2D trong Kế hoạch kiến trúc)
# Chạy với lệnh: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# ==============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartchain-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/supermarket_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: superuser
      SPRING_DATASOURCE_PASSWORD: superpassword
      SPRING_DATA_MONGODB_URI: mongodb://mongoadmin:mongopassword@mongodb:27017/supermarket_mongo?authSource=admin
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: redispassword
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: 9042
      CASSANDRA_KEYSPACE: supermarket_telemetry_ks
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4jpassword
      MQTT_BROKER_URL: tcp://mosquitto:1883
    depends_on:
      mosquitto:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
    container_name: smartchain-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
