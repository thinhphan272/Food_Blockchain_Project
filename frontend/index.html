<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartChain Enterprise — Hệ Thống Truy Xuất Nguồn Gốc Thực Phẩm Đa Ngành Hàng (IoT + Blockchain + 5 NoSQL)</title>
    <script>
      window.global = window;
      try {
        // Mặc định kích hoạt chuẩn Giao diện Sáng (Light Mode Warm Cream)
        const currentTheme = localStorage.getItem('smartchain_theme_v2');
        if (currentTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
          if (!currentTheme) {
            localStorage.setItem('smartchain_theme_v2', 'light');
          }
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  </head>

  </body>
</html>
